project_name: go-sdk-generator
env:
  - GO111MODULE=on
# Commented out because requires Pro features
# before:
# hooks:
# - cmd: go mod tidy
# dir: ./api
# - cmd: go generate ./...
# dir: ./api
builds:
  - dir: cli
    id: go-sdk-generator
    binary: go-sdk-generator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # Build for 64 bit Arm and Intel/AMD processors
    goarch:
      - amd64
      - arm64
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
checksum:
  name_template: "checksums.txt"
snapshot:
  name_template: "{{ incpatch .Tag }}-dev"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^changes:"
      - "^test:"
nfpms:
  - formats:
      - apk
      - deb
      - rpm
    license: Proprietary
    maintainer: OTG Services team <monty-bot@arm.com>

release:
  discussion_category_name: Releases
  # If the version tag looks like a pre-release e.g. beta then the GitHub release is set to prerelease
  prerelease: auto
  name_template: "Release {{.Version}}"
