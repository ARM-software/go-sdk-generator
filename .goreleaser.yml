# Code generated by our bespoke codegen `go-sdk-generator` (0.29.0).

version: 2
project_name: go-sdk-generator
# Whether to enable the size reporting or not.
report_sizes: true
env:
  - GO111MODULE=on
builds:
  - dir: cli
    id: go-sdk-generator
    binary: go-sdk-generator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # Build for 64 bit Arm and Intel/AMD processors
    goarch:
      - amd64
      - arm64
    hooks:
      pre:
        - chmod +x scripts/pre.sh
        - scripts/pre.sh
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
sboms:
  - artifacts: binary
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Tag }}-dev"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^changes:"
      - "^test:"
nfpms:
  - formats:
      - apk
      - deb
      - rpm
    license: Proprietary
    maintainer: Arm Online Services <monty-bot@arm.com>
    description: |-
      SDK/CLI generator from a specification following [schema](https://github.com/Arm-Debug/go-sdk-generator/blob/main/schema.yml)
    contents:
      - src: ./.manpages/
        dst: /usr/share/man/man1/
        type: tree
release:
  discussion_category_name: Releases
  # If the version tag looks like a pre-release e.g. beta then the GitHub release is set to prerelease
  prerelease: auto
  name_template: "Release {{.Version}}"
