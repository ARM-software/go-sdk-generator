# Code generated by our bespoke codegen `go-sdk-generator` (0.42.1).

version: 2
project_name: go-sdk-generator
# Whether to enable the size reporting or not.
report_sizes: true
env:
  - GO111MODULE=on
builds:
  - dir: cli
    id: go-sdk-generator
    binary: go-sdk-generator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # Build for 64 bit Arm and Intel/AMD processors
    goarch:
      - amd64
      - arm64
    hooks:
      pre:
        - chmod +x scripts/pre.sh
        - scripts/pre.sh
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
sboms:
  - artifacts: binary
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Tag }}-dev"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^changes:"
      - "^test:"
nfpms:
  - formats:
      - deb
      - rpm
    license: Proprietary
    maintainer: Arm Online Services <monty-bot@arm.com>
    description: |-
      SDK/CLI generator from a specification following [schema](https://github.com/Arm-Debug/go-sdk-generator/blob/main/generator/schema/schema.yml)
    contents:
      - src: ./.manpages/
        dst: /usr/share/man/man1/
        type: tree
      - src: ./.agents/skills/
        dst: /etc/go-sdk-generator/.agents/skills/
        type: tree
  - formats:
      - apk
    license: Proprietary
    maintainer: Arm Online Services <monty-bot@arm.com>
    description: |-
      SDK/CLI generator from a specification following [schema](https://github.com/Arm-Debug/go-sdk-generator/blob/main/generator/schema/schema.yml)
    contents:
      # FIXME: nfpm currently produces APK archives that apk-tools rejects when a
      # contents entry uses `type: tree`, so APK packaging lists the skill files
      # explicitly instead of packaging the whole directory as a tree.
      - src: ./.manpages/
        dst: /usr/share/man/man1/
        type: tree
      - src: ./.agents/skills/install-go-sdk-generator/SKILL.md
        dst: /etc/go-sdk-generator/.agents/skills/install-go-sdk-generator/SKILL.md
      - src: ./.agents/skills/run-go-sdk-generator/SKILL.md
        dst: /etc/go-sdk-generator/.agents/skills/run-go-sdk-generator/SKILL.md
      - src: ./.agents/skills/using-go-sdk-generator-in-a-github-action/SKILL.md
        dst: /etc/go-sdk-generator/.agents/skills/using-go-sdk-generator-in-a-github-action/SKILL.md

dockers_v2:
  - id: go-sdk-generator-ubuntu
    dockerfile: Dockerfile.oci.ubuntu
    images:
      - ghcr.io/arm-debug/go-sdk-generator
    tags:
      - v{{ .Version }}-ubuntu
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "io.arm.feature": "contract-first-sdk-generation"
      "org.opencontainers.image.description": "OCI image for running go-sdk-generator in CI and reproducible containerised workflows."
      "org.opencontainers.image.documentation": "https://github.com/Arm-Debug/go-sdk-generator"
      "org.opencontainers.image.licenses": "Proprietary"
      "org.opencontainers.image.source": "https://github.com/Arm-Debug/go-sdk-generator"
      "org.opencontainers.image.title": "SDK Generator"
    annotations:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "OCI image for running go-sdk-generator in CI and reproducible containerised workflows."
      "org.opencontainers.image.documentation": "https://github.com/Arm-Debug/go-sdk-generator/blob/main/DOCUMENTATION.md"
      "org.opencontainers.image.licenses": "Proprietary"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/Arm-Debug/go-sdk-generator"
      "org.opencontainers.image.title": "SDK Generator"
      "org.opencontainers.image.version": "{{ .Version }}"
  - id: go-sdk-generator-alpine
    dockerfile: Dockerfile.oci.alpine
    images:
      - ghcr.io/arm-debug/go-sdk-generator
    tags:
      - v{{ .Version }}-alpine
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "io.arm.feature": "contract-first-sdk-generation"
      "org.opencontainers.image.description": "OCI image for running go-sdk-generator in CI and reproducible containerised workflows."
      "org.opencontainers.image.documentation": "https://github.com/Arm-Debug/go-sdk-generator"
      "org.opencontainers.image.licenses": "Proprietary"
      "org.opencontainers.image.source": "https://github.com/Arm-Debug/go-sdk-generator"
      "org.opencontainers.image.title": "SDK Generator"
    annotations:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "OCI image for running go-sdk-generator in CI and reproducible containerised workflows."
      "org.opencontainers.image.documentation": "https://github.com/Arm-Debug/go-sdk-generator/blob/main/DOCUMENTATION.md"
      "org.opencontainers.image.licenses": "Proprietary"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/Arm-Debug/go-sdk-generator"
      "org.opencontainers.image.title": "SDK Generator"
      "org.opencontainers.image.version": "{{ .Version }}"

release:
  discussion_category_name: Releases
  # If the version tag looks like a pre-release e.g. beta then the GitHub release is set to prerelease
  prerelease: auto
  name_template: "Release {{.Version}}"
