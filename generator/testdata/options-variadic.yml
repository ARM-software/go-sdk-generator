specification:
  package_name: options-variadic-sdk
  main_module: optionsvariadic
  name: OptionsVariadicSDK
  description: Test manifest covering variadic option arguments, together-mode validation, and CLI collection defaults.
  update_copyright_headers: false

  options:
    - name: Build
      description: Build options.
      functions:
        - function_name: SetTracing
          parameters:
            - name: Tracing
              lang_type: bool
              description: Whether tracing output is enabled.
              default_value: "true"
        - parameters:
            - name: Verbose
              lang_type: bool
              description: Whether verbose output is enabled.
              default_value: "false"
        - parameters:
            - name: Connection
              lang_type: protectedConnection
              description: Optional protected connection used for remote builds.
        - parameters:
            - name: Mode
              lang_type: string
              description: Build mode.
              enum:
                - fast
                - safe
              default_value: fast
        - parameters:
            - name: UseWindow
              lang_type: bool
              description: Whether custom window settings should be applied.
              default_value: "false"
        - parameters:
            - name: WindowPreset
              lang_type: string
              description: Named window preset applied when custom window settings are enabled.
              condition: UseWindow == true
              value_field:
                name: Preset
                mapstructure_tag: preset
        - function_name: WithWindow
          parameters:
            - name: Width
              lang_type: int
              description: Requested output width.
              default_value: "80"
            - name: Height
              lang_type: int
              description: Requested output height.
              default_value: "24"

    - name: Deployment
      description: Together-mode deployment settings with literal enum defaults and disabled-state requirements.
      enable_mode: together
      functions:
        - parameters:
            - name: Locations
              lang_type: string
              list: true
              description: Deployment locations whose enum defaults must remain literal.
              enum: [home, remote]
              default_value: home
        - parameters:
            - name: LocationReferences
              lang_type: string
              list: true
              reference: true
              description: Referenced deployment locations whose enum defaults must remain literal.
              enum: [home, remote]
              default_value: home
        - parameters:
            - name: Names
              lang_type: string
              list: true
              description: Deployment names containing quotes and backslashes.
              constraints:
                enum: ['quoted "home"\path']
              default_value: 'quoted "home"\path'
        - parameters:
            - name: Directories
              lang_type: string
              list: true
              description: Non-enum defaults still resolve the home directory.
              default_value: home
        - parameters:
            - name: Reason
              lang_type: string
              description: Reason required when deployment is disabled.
              condition: Enabled == false
              default_value: not requested
        - parameters:
            - name: Target
              lang_type: string
              description: Required target validated only when deployment is enabled.
              required: true
              pattern: ^valid$
              default_value: valid

  interface:
    methods:
      - name: Build
        description: Build a project with variadic functional options.
        args:
          - name: projectDefinition
            lang_type: string
            description: Relative path to the project definition file.
          - name: buildOptions
            lang_type: options.BuildOptions
            description: Functional options applied to the build.
        returns:
          - name: ok
            lang_type: bool
            description: Whether the build was successful.
          - name: err
            lang_type: error
            description: Whether the build failed.

      - name: Deploy
        description: Deploy a project using together-mode functional options.
        args:
          - name: deploymentOptions
            lang_type: options.DeploymentOptions
            description: Functional options applied to deployment.
        returns:
          - name: err
            lang_type: error
            description: Whether deployment failed.

  global_configuration:
    - name: Enabled
      lang_type: bool
      mapstructure_tag: enabled
      description: Whether the generated manager is enabled.
      default_value: "true"

  command_line_commands:
    binary: options-variadic
    root_environment_var: OPTIONS_VARIADIC
    description: CLI for collection-default regression coverage.
    no_actions: true
    functions:
      - name: Deploy
        description: Deploy with whole-field collection defaults.
        with_summary: true
        configuration:
          - name: Modes
            lang_type: string
            list: true
            mapstructure_tag: modes
            description: Whole-field slice default used by generated validation tests.
            default_value: 'func() []string { return []string{"fast", "safe"} }()'
          - name: ModeReferences
            lang_type: string
            list: true
            reference: true
            mapstructure_tag: mode_references
            description: Whole-field referenced slice default used by generated validation tests.
            default_value: 'func() *[]string { values := []string{"fast", "safe"}; return &values }()'
          - name: ExampleModes
            lang_type: string
            list: true
            mapstructure_tag: example_modes
            description: Item example that must still become a one-item test collection.
            example: fast
