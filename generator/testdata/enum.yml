specification:
  package_name: enum-test-sdk
  main_module: enumtest
  name: EnumTest
  description: Test manifest ensuring string enums generate validation, constants, and CLI help text.
  update_copyright_headers: false

  interface:
    methods:
      - name: Publish
        description: Publish a document.
        args:
          - name: status
            lang_type: string
            default_value: draft
            enum:
              - draft
              - published
            description: Document status.
          - name: channel
            lang_type: string
            default_value: stable
            description: Publication channel.
            constraints:
              enum:
                - stable
                - preview
        returns:
          - name: result
            lang_type: string
            default_value: accepted
            enum:
              - accepted
              - rejected
            description: Publication result.
          - name: delivery
            lang_type: string
            default_value: queued
            description: Delivery status.
            constraints:
              enum:
                - queued
                - delivered
          - name: err
            lang_type: error
            description: Whether publishing failed.

  command_line_commands:
    binary: enum-test-sdk
    root_environment_var: ENUM_TEST
    description: CLI for enum generation tests
    functions:
      - name: Publish
        description: Publish a document.
        configuration:
          - name: Mode
            lang_type: string
            default_value: fast
            enum:
              - fast
              - safe
            mapstructure_tag: mode
            description: Execution mode.
            required: true
          - name: OutputFormat
            lang_type: string
            mapstructure_tag: output_format
            description: Publish output format.
            default_value: json
            constraints:
              enum:
                - json
                - yaml

  global_configuration:
    - name: OutputFormat
      lang_type: string
      enum:
        - json
        - yaml
      mapstructure_tag: output_format
      description: Output format.
      default_value: json
    - name: log_format
      lang_type: string
      mapstructure_tag: log_format
      description: Log format.
      default_value: text
      constraints:
        enum:
          - text
          - json

  additional_types:
    - name: Document
      description: Published document.
      fields:
        - name: Status
          lang_type: string
          default_value: draft
          enum:
            - draft
            - published
          json_tag: status
          mapstructure_tag: status
          description: Document status.
        - name: ReviewState
          lang_type: string
          default_value: pending
          json_tag: review_state
          mapstructure_tag: review_state
          description: Review state.
          constraints:
            enum:
              - pending
              - approved
