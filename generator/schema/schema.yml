x-always-protected-cli-argument-names: &x-always-protected-cli-argument-names
  # These names are injected by the generator for built-in CLI wiring and are
  # therefore always reserved for internal use.
  - Summary
  - SummaryFile
  - Logger
  - LoggerFile
  - Annotation
  - ShowConfig

x-result-protected-cli-argument-names: &x-result-protected-cli-argument-names
  # These names are injected by the generator only when `with_result: true`
  # enables result output wiring for the command.
  - OutputFormat
  - OutputFile

x-parameter-value-constraint-operators: &x-parameter-value-constraint-operators
  - present
  - absent
  - equals
  - not_equals
  - in
  - not_in

x-description: &x-description
  type: string
  description: |
    A human-readable description.
    Multiline YAML descriptions using `|` are supported.

x-deprecation-notice-ref: &x-deprecation-notice-ref
  $ref: "#/$defs/deprecation_notice"

x-parameter-properties: &x-parameter-properties
  name:
    type: string
    description: The name of the field
  lang_type:
    type: string
    description: The language type for the field
  enum:
    type: array
    description: Allowed string values for the field. This is only supported for string-compatible values.
    items:
      type: string
  json_tag:
    type: string
    description: The JSON tag of the field
  mapstructure_tag:
    type: string
    description: The mapstructure tag of the field
  pattern:
    type: string
    description: The pattern that the field should follow if it is a string
  required:
    type: boolean
    default: false
    description: Whether the configuration value is required
  condition:
    type: string
    default: ""
    description: A condition in which to require the value. It should be based on one (and one only) other configuration variable. Condition MUST start with the name of the variable and only mention it once
  constraints:
    $ref: "#/$defs/parameter_constraints"
  reference:
    type: boolean
    default: false
    description: Whether the value is a pointer
  list:
    type: boolean
    default: false
    description: Whether the value should be represented as a list of the language type
  iterator:
    type: boolean
    default: false
    description: Whether the value should be represented as an iterator over the language type using iter.Seq
  default_value:
    type: string
    description: An optional default value for use when creating a new instance of the configuration
  example:
    type: string
    description: |
      A single example value for the field.
      For list or iterator shapes, the example represents one item value.
  examples:
    type: array
    description: |
      Example values for the field.
      For list or iterator shapes, each example represents one item value.
    items:
      type: string
  description: *x-description
  is_root:
    type: boolean
    description: Whether the variable should be in the root command so it can be shared between sub commands
    default: false
  arg:
    type: string
    description: The argument to bind to
  arg_short:
    type: string
    description: The short version of the argument to bind to
  hidden:
    type: boolean
    default: false
    description: Whether to mark the flag as hidden in the command line
  secret:
    type: boolean
    default: false
    description: Whether the parameter contains secret material and should be included in credentials storage
  deprecation_notice: *x-deprecation-notice-ref

x-parameter-properties-with-bindings: &x-parameter-properties-with-bindings
  <<: *x-parameter-properties
  bindings:
    type: array
    description: Bind configuration options to variables
    items:
      $ref: "#/$defs/binding"

x-parameter: &x-parameter
  description: A command argument or code parameter
  type: object
  properties: *x-parameter-properties-with-bindings
$schema: https://json-schema.org/draft/2020-12/schema
title: SDK
description: SDK definition
type: object
properties:
  specification:
    description: The SDK root specification
    type: object
    required:
      - package_name
      - main_module
      - interface
      - global_configuration
    properties:
      package_name:
        type: string
        description: The package name for the main SDK module
      main_module:
        type: string
        description: The module within the package
      name:
        type: string
        description: The name of the SDK to expose (used for the interface and its implementations)
      description: *x-description
      repository_url:
        type: string
        description: |
          The URL where the project's repository is hosted.
          Defaults to https://github.com/Arm-Debug/{package_name} when omitted.
          GitHub-specific links are generated only when this is a GitHub repository URL.
          Other forges are not currently supported for GitHub-specific outputs.
      public:
        type: boolean
        default: false
        description: |
          Whether the project is public.
          Public projects are expected not to rely on private dependencies or need access to private resources.
      licence:
        type: string
        description: The licence SPDX identifier (https://spdx.org/licenses/) for the SDK
        default: Proprietary
      conf_file:
        type: string
        description: An optional configuration file that will be used to load values from (in addtion to cli args and env vars)
      additional_types:
        $ref: "#/$defs/types"
      options:
        $ref: "#/$defs/option_sets"
      interface:
        $ref: "#/$defs/interface"
      command_line_commands:
        $ref: "#/$defs/command_line_commands"
      global_configuration:
        description: |
          Global configuration fields shared across the generated SDK and CLI.
        $ref: "#/$defs/configuration"
      extra_imports:
        $ref: "#/$defs/extra_imports"
      extra_valid_types:
        $ref: "#/$defs/extra_valid_types"
      ci_extra_packages:
        $ref: "#/$defs/ci_extra_packages"
      release_to_artifactory:
        $ref: "#/$defs/release_to_artifactory"
      release_to_public_artifactory:
        $ref: "#/$defs/release_to_public_artifactory"
      distribute_oci:
        $ref: "#/$defs/distribute_oci"
$defs:
  types:
    type: array
    description: A set of entities to export
    items:
      $ref: "#/$defs/type"
  type:
    description: A entity type
    type: object
    required:
      - name
      - description
      - fields
    properties:
      name:
        type: string
        description: The name of the entity
      package:
        type: string
        default: types
        description: |
          The package the type is defined in.
          Defaults to `types`.
          This must resolve to a single package segment, not a nested path.
      description: *x-description
      deprecation_notice: *x-deprecation-notice-ref
      fields:
        type: array
        items:
          $ref: "#/$defs/entity_field"
    additionalProperties: false
  option_sets:
    type: array
    description: A set of functional option collections to export
    items:
      $ref: "#/$defs/option_set"
  option_set:
    description: A functional option collection
    type: object
    required:
      - name
      - description
      - functions
    properties:
      name:
        type: string
        description: The name of the functional option collection
      package:
        type: string
        default: options
        description: |
          The package the functional option collection is defined in.
          Defaults to `options`.
          This must resolve to a single package segment, not a nested path.
      description: *x-description
      deprecation_notice: *x-deprecation-notice-ref
      functions:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/option_function"
    additionalProperties: true
  option_function:
    description: A generated functional option helper
    type: object
    required:
      - parameters
    properties:
      function_name:
        type: string
        description: |
          The helper function name to generate for this option.
          When omitted for a single non-boolean parameter, this defaults to `With<Name>`.
          When omitted for a single boolean parameter, this defaults to generating `With<Name>()` and `Without<Name>()`.
          When more than one parameter is defined, `function_name` is required.
      parameters:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/option_parameter"
    additionalProperties: false
  option_parameter:
    description: A parameter on a generated functional option collection
    type: object
    required:
      - name
      - lang_type
      - description
    properties:
      <<: *x-parameter-properties
      value_field:
        $ref: "#/$defs/option_value_field"
    not:
      required:
        - bindings
    additionalProperties: true
  option_value_field:
    description: Optional name and mapstructure tag for the value held by a generated option. Defaults to the option parameter's name and its snake_case form.
    type: object
    properties:
      name:
        type: string
        description: The field name for the option value; defaults to the option parameter's name.
      mapstructure_tag:
        type: string
        description: The mapstructure tag of the value field; defaults to the snake_case value field name.
    additionalProperties: false
  interface:
    description: An interface
    type: object
    required:
      - methods
    properties:
      namespace:
        type: string
        default: github.com/Arm-Debug/
        description: |
          The import namespace prefix for the generated SDK or library.
          This value may be normalised by the generator to comply with language expectations.
          It may differ from repository_url when the hosted project location and the SDK import namespace are intentionally separate.
      notCloseable:
        type: boolean
        default: false
        description: Whether the manager should be Closeable (i.e. has a Close() method to call whilst closing) or not.
      deprecation_notice: *x-deprecation-notice-ref
      methods:
        type: array
        items:
          $ref: "#/$defs/interface_method"
    additionalProperties: false
  command_line_commands:
    description: A CLI command
    type: object
    required:
      - functions
    properties:
      binary:
        type: string
        description: Name of the executable
      package:
        type: string
        default: cli
        description: |
          The package the generated CLI project is defined in.
          Defaults to `cli`.
          This must resolve to a single package segment, not a nested path.
      interrupt_exit_code:
        type: integer
        description: The exit code to return when an interrupt signal (SIGINT or SIGTERM) is received
      root_environment_var:
        type: string
        description: Environment variable prefix
      description: *x-description
      no_actions:
        type: boolean
        default: false
        description: Whether to skip generating GitHub Actions for the CLI
      callCloud:
        type: boolean
        description: |
          Whether all functions need to call the Arm Cloud hosted online services.
          When enabled, default API key and host arguments are injected only if they are not explicitly defined. They will also be defined as root arguments, required by all functions.
      functions:
        type: array
        items:
          $ref: "#/$defs/cli_function"
    additionalProperties: false
  interface_method:
    description: An interface method
    type: object
    required:
      - name
      - description
    properties:
      name:
        type: string
        description: The name of the field
      description: *x-description
      deprecation_notice: *x-deprecation-notice-ref
      args:
        type: array
        items:
          $ref: "#/$defs/command_argument"
      returns:
        type: array
        items:
          $ref: "#/$defs/command_argument"
    additionalProperties: false
  extra_imports:
    type: array
    items:
      $ref: "#/$defs/extra_import"
  extra_valid_types:
    type: array
    items:
      type: string
  ci_extra_packages:
    type: array
    items:
      type: string
  release_to_artifactory:
    type: boolean
    default: false
    description: Whether to release the package to artifactory. Will require a .goreleaser file or equivalent file to be set up
  parameter_value_constraint:
    type: object
    description: |
      A value-based constraint against another parameter.
      This definition is used by parameter `constraints` for relationships that
      depend on another parameter's presence or value.
    additionalProperties: true
    required:
      - parameter
    properties:
      parameter:
        type: string
        description: The name of the parameter being evaluated
      operator:
        type: string
        default: present
        description: The comparison performed against the parameter
        enum: *x-parameter-value-constraint-operators
      value:
        description: The value used by operators such as equals or not_equals
      values:
        type: array
        description: Values used by operators such as in or not_in
        items: {}
  parameter_value_comparison_constraint:
    type: object
    description: |
      A value comparison against another parameter.
      This definition is used by parameter `constraints.parameter_value` when
      the current parameter value must equal or differ from another parameter
      value.
      Unlike `required_when` or `forbidden_when`, this is not a rule about
      whether the parameter itself is present. It is a rule about which values
      of the current parameter are valid when compared with another parameter
      value.
    additionalProperties: true
    required:
      - parameter
      - operator
    properties:
      parameter:
        type: string
        description: The name of the parameter whose value is compared with the current parameter value
      operator:
        type: string
        description: The comparison performed between the current parameter value and the referenced parameter value
        enum: *x-parameter-value-constraint-operators
      when:
        type: string
        default: always
        description: |
          Controls when this comparison is evaluated against the current parameter
          value. `always` applies the comparison unconditionally. `empty` applies it
          only when the current parameter value is empty according to the generator's
          normal validation semantics. `not_empty` applies it only when the current
          parameter value is non-empty.
        enum:
          - always
          - empty
          - not_empty
  parameter_forbidden_values_constraint:
    type: object
    description: |
      A conditional forbidden-values rule for the current parameter value.
      This definition is used by parameter `constraints.forbidden_values_when`
      when specific values of the current parameter become invalid depending on
      another parameter value.
      Unlike `required_when` or `forbidden_when`, this is not a rule about
      whether the parameter itself is present. It is a rule about which values
      of the current parameter are valid.
    additionalProperties: true
    required:
      - parameter
      - forbidden_values
    properties:
      parameter:
        type: string
        description: The name of the parameter being evaluated
      operator:
        type: string
        default: present
        description: The comparison performed against the parameter
        enum: *x-parameter-value-constraint-operators
      value:
        description: The value used by operators such as equals or not_equals
      values:
        type: array
        description: Values used by operators such as in or not_in
        items: {}
      forbidden_values:
        type: array
        description: Values of the current parameter that are forbidden when the condition matches
        items: {}
  parameter_required_values_constraint:
    type: object
    description: |
      A conditional required-values rule for the current parameter value.
      This definition is used by parameter `constraints.required_values_when`
      when the current parameter value must be one of the specified values
      depending on another parameter value.
      Unlike `required_when` or `forbidden_when`, this is not a rule about
      whether the parameter itself is present. It is a rule about which values
      of the current parameter are valid.
    additionalProperties: true
    required:
      - parameter
      - required_values
    properties:
      parameter:
        type: string
        description: The name of the parameter being evaluated
      operator:
        type: string
        default: present
        description: The comparison performed against the parameter
        enum: *x-parameter-value-constraint-operators
      value:
        description: The value used by operators such as equals or not_equals
      values:
        type: array
        description: Values used by operators such as in or not_in
        items: {}
      required_values:
        type: array
        description: Values of the current parameter that are required when the condition matches
        items: {}
  parameter_constraints:
    type: object
    description: |
      Validation constraints applying to a parameter.
      These constraints complement the existing `condition` field rather than
      replacing it. Use `condition` for the current expression-style required
      logic, and `constraints` for explicit cross-parameter relationships.
    additionalProperties: true
    properties:
      enum:
        type: array
        description: |
          Validation-oriented equivalent of the top-level `enum` field.
          When the top-level `enum` is omitted, this can also drive generated
          enum-backed parameter types.
          This follows the JSON Schema `enum` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/enum
        items:
          type: string
      pattern:
        type: string
        description: |
          Validation-oriented equivalent of the top-level `pattern` field.
          This is only valid for scalar string-compatible values.
          This follows the JSON Schema `pattern` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/string#regular-expressions
      required:
        type: boolean
        default: false
        description: |
          Validation-oriented equivalent of the top-level `required` field.
          This marks the parameter as required in the generated configuration
          validation and documentation.
          This is analogous to listing the containing property under JSON Schema
          `required`.
          Reference: https://json-schema.org/understanding-json-schema/reference/object#required
      nullable:
        type: boolean
        default: false
        description: |
          Allow the value to be omitted or null while still validating the
          nested constraints whenever a value is provided.
      not_empty:
        type: boolean
        default: false
        description: |
          Require the value to be non-empty according to the generator's normal
          validation semantics.
      contains:
        type: string
        description: |
          Require a scalar string-compatible value to contain the given
          substring.
      not_contains:
        type: string
        description: |
          Require a scalar string-compatible value not to contain the given
          substring.
      prefix:
        type: string
        description: |
          Require a scalar string-compatible value to start with the given
          prefix.
      suffix:
        type: string
        description: |
          Require a scalar string-compatible value to end with the given
          suffix.
      min_length:
        type: integer
        description: |
          Minimum number of Unicode code points allowed for a scalar
          string-compatible value.
          This follows the JSON Schema `minLength` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/string#length
      max_length:
        type: integer
        description: |
          Maximum number of Unicode code points allowed for a scalar
          string-compatible value.
          This follows the JSON Schema `maxLength` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/string#length
      minimum:
        type: number
        description: |
          Inclusive lower bound for a scalar numeric value.
          This follows the JSON Schema `minimum` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/numeric#range
      maximum:
        type: number
        description: |
          Inclusive upper bound for a scalar numeric value.
          This follows the JSON Schema `maximum` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/numeric#range
      exclusive_minimum:
        type: number
        description: |
          Exclusive lower bound for a scalar numeric value.
          This follows the JSON Schema `exclusiveMinimum` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/numeric#range
      exclusive_maximum:
        type: number
        description: |
          Exclusive upper bound for a scalar numeric value.
          This follows the JSON Schema `exclusiveMaximum` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/numeric#range
      multiple_of:
        type: number
        description: |
          Require a scalar numeric value to be an exact multiple of the given
          positive number.
          This follows the JSON Schema `multipleOf` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/numeric#multiples
      min_items:
        type: integer
        description: |
          Minimum number of items allowed in a list or iterator value.
          This follows the JSON Schema `minItems` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/array#length
      max_items:
        type: integer
        description: |
          Maximum number of items allowed in a list or iterator value.
          This follows the JSON Schema `maxItems` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/array#length
      unique_items:
        type: boolean
        default: false
        description: |
          Require all items in a list or iterator value to be unique.
          This follows the JSON Schema `uniqueItems` keyword.
          Reference: https://json-schema.org/understanding-json-schema/reference/array#uniqueness
      extension:
        type: array
        description: |
          Allowed filename extensions for a scalar string-compatible path value,
          for example `.json` or `.yaml`.
        items:
          type: string
      at_least_one:
        type: boolean
        default: false
        description: |
          Require a list or iterator value to contain at least one item.
          This is a convenience alias for `min_items: 1`.
      exactly_one:
        type: boolean
        default: false
        description: |
          Require a list or iterator value to contain exactly one item.
          This is a convenience alias for `min_items: 1` together with
          `max_items: 1`.
      dependent_required:
        type: array
        description: |
          Parameters that must be provided when this parameter is provided.
        items:
          type: string
        uniqueItems: true
      require_together_as_cli_flags:
        type: boolean
        default: false
        description: |
          Whether `dependent_required` should also require the related values
          to be passed together as CLI arguments when all referenced parameters
          also opt in.
          This only affects CLI argument behaviour and does not change the
          runtime validation rules.
      conflicts_with:
        type: array
        description: |
          Parameters that must not be provided when this parameter is provided.
        items:
          type: string
        uniqueItems: true
      parameter_value:
        $ref: "#/$defs/parameter_value_comparison_constraint"
      required_values_when:
        type: array
        description: |
          Conditions that require the current parameter to use one of the specified values.
        items:
          $ref: "#/$defs/parameter_required_values_constraint"
      forbidden_values_when:
        type: array
        description: |
          Conditions that forbid specific values of the current parameter.
        items:
          $ref: "#/$defs/parameter_forbidden_values_constraint"
      required_when:
        $ref: "#/$defs/parameter_value_constraint"
      forbidden_when:
        $ref: "#/$defs/parameter_value_constraint"
  release_to_public_artifactory:
    type: object
    description: |
      Configuration for uploading a release artefact produced by a private repository
      release workflow to a public Artifactory registry.
    required:
      - artifactory_host
      - registry
    properties:
      artifactory_host:
        type: string
        description: The public Artifactory host used for the follow-up release upload job.
      registry:
        type: string
        description: The registry within Artifactory used for the public release upload job.
    additionalProperties: false
  # Copied from https://github.com/opencontainers/image-spec/blob/main/schema/defs.json
  # (`#/definitions/mapStringString`) so this schema stays self-contained.
  oci_map_string_string:
    type: object
    description: |
      Additional OCI image metadata used to complement the default metadata
      generated from the tool documentation and repository metadata.
    patternProperties:
      .{1,}:
        type: string
  distribute_oci:
    type: object
    description: |
      Configuration for publishing multi-architecture OCI images for the generated CLI.
      OCI images are useful for CI integration, reproducible builds, and users who prefer not to install the tool locally.
      OCI image publication currently targets GitHub Container Registry for GitHub-hosted repositories.
    required:
      - description
    properties:
      description:
        type: string
        description: Text description applied to the OCI image metadata and registry page.
      labels:
        description: |
          Additional OCI image labels applied to each built image.
          These complement the default labels generated from the tool documentation
          and repository metadata.
        $ref: "#/$defs/oci_map_string_string"
      attributes:
        description: |
          Additional OCI manifest attributes applied as OCI annotations to the
          published image manifests.
          These complement the default OCI annotations generated from the tool
          documentation and repository metadata.
        $ref: "#/$defs/oci_map_string_string"
    additionalProperties: false
  deprecation_notice:
    type: object
    description: |
      Deprecation metadata used to surface notices in generated code comments,
      generated documentation, and CLI deprecation warnings.
    required:
      - issue_date
    properties:
      issue_date:
        type: string
        format: date-time
        description: The date-time when the deprecation was first issued.
      removal_date:
        type: string
        format: date-time
        description: |
          The optional date-time when the deprecated item is expected to be removed.
          When provided, it must not be earlier than `issue_date`.
      description: *x-description
      replacement:
        type: string
        description: An optional replacement to recommend to consumers.
    additionalProperties: false
  summary_destination:
    title: SummaryDestination
    description: Built-in destinations supported by generated CLI summaries.
    type: string
    enum:
      - file
      - github
      - output
  built_in_lang_type:
    title: BuiltInLangType
    description: |
      Built-in `lang_type` strings recognised by the generator.
      `lang_type` fields may still use arbitrary strings for custom or generated
      types, but these built-ins are provided as an authoritative generated list.
    type: string
    enum:
      - time.Duration
      - duration
      - '[]byte'
      - string
      - int
      - int8
      - int16
      - int32
      - int64
      - uint
      - uint8
      - uint16
      - uint32
      - uint64
      - decimal
      - float32
      - float64
      - bool
      - hex
      - binary
      - byte
      - base64
      - url
      - uri
      - host
      - port
      - version
      - semver
      - uuid
      - email
      - json
      - validJSON
      - ip
      - datetime
      - regex
      - '[]string'
      - filepath
      - existingFilepath
      - pathParameter
      - connection
      - onlineTarget
      - protectedConnection
      - service
      - server
      - protectedService
      - protectedServer
      - behindAuthConnection
      - behindAuthService
      - behindAuthServer
      - serviceBehindAuth
      - serverBehindAuth
  semantic_default_value:
    title: SemanticDefaultValue
    description: |
      Built-in symbolic `default_value` strings recognised specially by the generator.
      `default_value` fields may still use arbitrary strings or expressions, but
      these tokens are provided as an authoritative generated list for the built-ins.
    type: string
    enum:
      - hostname
      - uuid
      - temp
      - tempdir
      - temporary
      - bin
      - bindir
      - cache
      - cachedir
      - config
      - configdir
      - conf
      - configuration
      - here
      - cwd
      - home
      - random
      - now
  cli_function:
    description: An CLI function
    type: object
    required:
      - name
      - description
