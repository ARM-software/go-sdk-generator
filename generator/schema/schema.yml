x-parameter: &x-parameter
  description: A command argument or code parameter
  type: object
  properties:
    name:
      type: string
      description: The name of the field
    lang_type:
      type: string
      description: The language type for the field
    json_tag:
      type: string
      description: The JSON tag of the field
    mapstructure_tag:
      type: string
      description: The mapstructure tag of the field
    pattern:
      type: string
      description: The pattern that the field should follow if it is a string
    required:
      type: boolean
      default: false
      description: Whether the configuration value is required
    condition:
      type: string
      default: ""
      description: A condition in which to require the value. It should be based on one (and one only) other configuration variable. Condition MUST start with the name of the variable and only mention it once
    reference:
      type: boolean
      default: false
      description: Whether the value is a pointer
    default_value:
      type: string
      description: An optional default value for use when creating a new instance of the configuration
    bindings:
      type: array
      description: Bind congifuration options to variables
      items:
        $ref: "#/$defs/binding"
    description:
      type: string
      description: The description of the field
    is_root:
      type: boolean
      description: Whether the variable should be in the root command so it can be shared between sub commands
      default: false
    arg:
      type: string
      description: The argument to bind to
    arg_short:
      type: string
      description: The short version of the argument to bind to
    hidden:
      type: boolean
      default: false
      description: Whether to mark the flag as hidden in the command line
    secret:
      type: boolean
      default: false
      description: Whether the parameter contains secret material and should be included in credentials storage
$schema: https://json-schema.org/draft/2020-12/schema
title: SDK
description: SDK definition
type: object
properties:
  specification:
    description: The SDK root specification
    type: object
    required:
      - package_name
      - main_module
      - interface
      - global_configuration
    properties:
      package_name:
        type: string
        description: The package name for the main SDK module
      main_module:
        type: string
        description: The module within the package
      name:
        type: string
        description: The name of the SDK to expose (used for the interface and its implementations)
      description:
        type: string
        description: The description of the SDK
      repository_url:
        type: string
        description: |
          The URL where the project's repository is hosted.
          Defaults to https://github.com/Arm-Debug/{package_name} when omitted.
          GitHub-specific links are generated only when this is a GitHub repository URL.
          Other forges are not currently supported for GitHub-specific outputs.
      public:
        type: boolean
        default: false
        description: |
          Whether the project is public.
          Public projects are expected not to rely on private dependencies or need access to private resources.
      licence:
        type: string
        description: The licence SPDX identifier (https://spdx.org/licenses/) for the SDK
        default: Proprietary
      conf_file:
        type: string
        description: An optional configuration file that will be used to load values from (in addtion to cli args and env vars)
      additional_types:
        $ref: "#/$defs/types"
      interface:
        $ref: "#/$defs/interface"
      command_line_commands:
        $ref: "#/$defs/command_line_commands"
      global_configuration:
        $ref: "#/$defs/configuration"
      extra_imports:
        $ref: "#/$defs/extra_imports"
      extra_valid_types:
        $ref: "#/$defs/extra_valid_types"
      ci_extra_packages:
        $ref: "#/$defs/ci_extra_packages"
      release_to_artifactory:
        $ref: "#/$defs/release_to_artifactory"
      release_to_public_artifactory:
        $ref: "#/$defs/release_to_public_artifactory"
$defs:
  types:
    type: array
    description: A set of entities to export
    items:
      $ref: "#/$defs/type"
  type:
    description: A entity type
    type: object
    required:
      - name
      - description
      - fields
    properties:
      name:
        type: string
        description: The name of the entity
      description:
        type: string
        description: The description of the entity
      fields:
        type: array
        items:
          $ref: "#/$defs/entity_field"
  interface:
    description: An interface
    type: object
    required:
      - methods
    properties:
      namespace:
        type: string
        default: github.com/Arm-Debug/
        description: |
          The import namespace prefix for the generated SDK or library.
          This value may be normalised by the generator to comply with language expectations.
          It may differ from repository_url when the hosted project location and the SDK import namespace are intentionally separate.
      notCloseable:
        type: boolean
        default: false
        description: Whether the manager should be Closeable (i.e. has a Close() method to call whilst closing) or not.
      methods:
        type: array
        items:
          $ref: "#/$defs/interface_method"
    additionalProperties: false
  command_line_commands:
    description: A CLI command
    type: object
    required:
      - functions
    properties:
      binary:
        type: string
        description: Name of the executable
      interrupt_exit_code:
        type: integer
        description: The exit code to return when an interrupt signal (SIGINT or SIGTERM) is received
      root_environment_var:
        type: string
        description: Environment variable prefix
      description:
        type: string
        description: The description of the CLI binary
      no_actions:
        type: boolean
        default: false
        description: Whether to skip generating GitHub Actions for the CLI
      callCloud:
        type: boolean
        description: |
          Whether all functions need to call the Arm Cloud hosted online services.
          When enabled, default API key and host arguments are injected only if they are not explicitly defined. They will also be defined as root arguments, required by all functions.
      functions:
        type: array
        items:
          $ref: "#/$defs/cli_function"
    additionalProperties: false
  interface_method:
    description: An interface method
    type: object
    required:
      - name
      - description
    properties:
      name:
        type: string
        description: The name of the field
      description:
        type: string
        description: The description of the field
      args:
        type: array
        items:
          $ref: "#/$defs/command_argument"
      returns:
        type: array
        items:
          $ref: "#/$defs/command_argument"
    additionalProperties: false
  extra_imports:
    type: array
    items:
      $ref: "#/$defs/extra_import"
  extra_valid_types:
    type: array
    items:
      type: string
  ci_extra_packages:
    type: array
    items:
      type: string
  release_to_artifactory:
    type: boolean
    default: false
    description: Whether to release the package to artifactory. Will require a .goreleaser file or equivalent file to be set up
  release_to_public_artifactory:
    type: object
    description: |
      Configuration for uploading a release artefact produced by a private repository
      release workflow to a public Artifactory registry.
    required:
      - artifactory_host
      - registry
    properties:
      artifactory_host:
        type: string
        description: The public Artifactory host used for the follow-up release upload job.
      registry:
        type: string
        description: The registry within Artifactory used for the public release upload job.
    additionalProperties: false
  cli_function:
    description: An CLI function
    type: object
    required:
      - name
      - description
      - configuration
    properties:
      name:
        type: string
        description: The name of the field
      description:
        type: string
        description: The description of the field
      configuration:
        type: array
        items:
          $ref: "#/$defs/function_config_fields"
      operands:
        description: Allow the use of positional operands specified after '--' in a POSIX fashion
        type: boolean
        default: false
      callCloud:
        type: boolean
        description: |
          Whether the function needs to call the Arm Cloud hosted online services.
          When enabled, default API key and host arguments are injected only if they are not explicitly defined.
        default: false
      silenceUsage:
        type: boolean
        description: |
          Whether to silence usage when an error occurs.
        default: false
      hidden:
        type: boolean
        description: |
          Whether this function is hidden and should NOT show up in the list of available commands.
        default: false
      no_action:
        type: boolean
        description: Whether to skip generating the GitHub Action wrapper for this command
        default: false
      loadFromKeyring:
        description: Whether to load some configuration input from system's keyring service
        type: boolean
        default: false
      storeToKeyring:
        description: Whether to store the configuration to system's keyring service
        type: boolean
        default: false
    additionalProperties: false
  function_config_fields:
    <<: *x-parameter
    required:
      - name
      - lang_type
      - mapstructure_tag
      - description
    additionalProperties: false
  command_argument:
    <<: *x-parameter
    required:
      - name
      - lang_type
      - description
    additionalProperties: false
  entity_field:
    <<: *x-parameter
    required:
      - name
      - lang_type
      - json_tag
      - description
    additionalProperties: false

  binding:
    description: A variable binding to a parameter
    type: object
    properties:
      name:
        type: string
        description: The name of the field
      arg:
        type: string
        description: The argument to bind to
      arg_short:
        type: string
        description: The optional short version of the argument
      mapstructure_tag:
        type: string
        description: The tag fragment used when building the environment variable key
      lang_type:
        type: string
        description: The type for the field
      description:
        type: string
        description: The description of the field
      hidden:
        type: boolean
        default: false
        description: Whether to mark the flag as hidden in the command line
      secret:
        type: boolean
        default: false
        description: Whether the binding contains secret material and should be included in credentials storage
    additionalProperties: false
  extra_import:
    description: An extra import
    type: object
    properties:
      import_url:
        type: string
        description: The import URL
      import_ref:
        type: string
        description: The reference to use when referencing the import
    additionalProperties: false
  configuration:
    type: array
    description: The configuration options for the exported implementation
    items:
      $ref: "#/$defs/configuration_option"
  configuration_option:
    <<: *x-parameter
    required:
      - name
      - lang_type
      - mapstructure_tag
      - description
    additionalProperties: false
required:
  - specification
additionalProperties: false
