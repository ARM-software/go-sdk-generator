name: Action integration tests

# Cancel in-progress jobs or runs for the current workflow
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ inputs.branch || github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main

env:
  go_version: "1.26.2"

jobs:
  test-action-github-runner:
    name: Action integration test on GH runners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Git with secret
        run: |
          git config --global url."https://${{ secrets.GIT_SECRET }}:x-oauth-basic@github.com/Arm-Debug".insteadOf "https://github.com/Arm-Debug"
        env:
          GIT_SECRET: ${{ secrets.GIT_SECRET }}

      - name: Run local action
        uses: ./actions/generate
        with:
          action-repo: ${{ github.repository }}
          action-ref: ${{ github.sha }}
          github-token: ${{ secrets.GIT_SECRET }}
          input: generate.yml
          output: ./tmp/action-test-local-gh
          go-version: 1.26.2

      - name: Verify local action generated files are present
        shell: bash
        run: |
          set -euo pipefail

          actual_paths="$(mktemp)"

          find ./tmp/action-test-local-gh -type f -printf '%P\n' | sort > "$actual_paths"

          if [[ ! -s "$actual_paths" ]]; then
            printf 'No generated files were found in ./tmp/action-test-local-gh\n' >&2
            exit 1
          fi

          while IFS= read -r path; do
            generated_path="./tmp/action-test-local-gh/${path}"

            if [[ ! -s "$generated_path" ]]; then
              printf 'Generated path missing or empty from local action output: %s\n' "$generated_path" >&2
              exit 1
            fi
          done < "$actual_paths"

      - name: Run unpublished action and binary
        uses: ./actions/generate
        with:
          action-repo: ${{ github.repository }}
          action-ref: ${{ github.sha }}
          github-token: ${{ secrets.GIT_SECRET }}
          input: generate.yml
          output: ./tmp/action-test-source-gh
          go-version: 1.26.2

      - name: Verify source generated files match repository
        shell: bash
        run: |
          set -euo pipefail

          actual_paths="$(mktemp)"

          find ./tmp/action-test-source-gh -type f -printf '%P\n' | sort > "$actual_paths"

          if [[ ! -s "$actual_paths" ]]; then
            printf 'No generated files were found in ./tmp/action-test-source-gh\n' >&2
            exit 1
          fi

          while IFS= read -r path; do
            repo_path="./${path}"
            generated_path="./tmp/action-test-source-gh/${path}"

            if [[ ! -s "$repo_path" ]]; then
              printf 'Repository path missing or empty for generated output: %s\n' "$repo_path" >&2
              exit 1
            fi

            if [[ ! -s "$generated_path" ]]; then
              printf 'Generated path missing or empty from source action output: %s\n' "$generated_path" >&2
              exit 1
            fi
          done < "$actual_paths"

