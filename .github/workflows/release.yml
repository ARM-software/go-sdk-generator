# Code generated by our bespoke codegen `go-sdk-generator` (0.47.0).

name: GitHub Release

env:
  go_version: "1.26.5"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Enter type of release to perform (i.e. development, beta, release):"
        required: true

permissions:
  contents: write

  packages: write


jobs:
  release:
    name: Carry out a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CI/CD tools
        run: pip install continuous-delivery-scripts && pip list
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          distribution: goreleaser
          version: latest
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Set up QEMU for multi-arch OCI builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ARM_SOFTWARE_TOKEN || github.token }}

      - name: Tag and release
        run: cd-tag-and-release -b "$GIT_BRANCH" -t ${{ github.event.inputs.release_type }} -vv
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_TOKEN: ${{ secrets.ARM_SOFTWARE_TOKEN || github.token }}
