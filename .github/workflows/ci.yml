# Code generated by our bespoke codegen `go-sdk-generator` (0.51.0).

name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - main

env:
  go_version: "1.26.5"

jobs:
  assert-news:
    name: Assert news files (See CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
      - name: Install CI/CD tools
        run: pip install continuous-delivery-scripts && pip list
      - name: Assert news
        run: cd-assert-news -b "$GIT_BRANCH"
        env:
          GIT_BRANCH: ${{ github.head_ref || github.ref }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "::error:: News file missing (See CONTRIBUTING.md guide for details)."
          echo "## :warning: CI failure" >> "$GITHUB_STEP_SUMMARY"
          echo "News file missing. See \\`CONTRIBUTING.md\\` for the expected news file format and location." >> "$GITHUB_STEP_SUMMARY"

  detect-secrets:
    name: Check for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
      - name: Install CI/CD tools
        run: pip install continuous-delivery-scripts && pip list
      - name: Detect secrets
        run: cd-detect-secrets
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "::error:: Potential secrets detected in the repository."
          echo "## :rotating_light: CI failure" >> "$GITHUB_STEP_SUMMARY"
          echo "Potential secrets were detected in the repository." >> "$GITHUB_STEP_SUMMARY"

  tpip:
    name: Check third-party IP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/setup-python@v6
      - name: Install CI/CD tools
        run: pip install continuous-delivery-scripts>=2.7 && pip list
      - name: Sync workspace
        uses: ARM-software/golang-utils/actions/sync-go-workspace@latest
      - name: Download Go module dependencies
        uses: ARM-software/golang-utils/actions/go-multimodules@latest
        with:
          task: download
      - name: Check third-party IP
        run: cd-check-licence-compliance
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "::error:: Third-party IP or licence compliance checks failed."
          echo "## :warning: CI failure" >> "$GITHUB_STEP_SUMMARY"
          echo "Third-party IP or licence compliance checks failed." >> "$GITHUB_STEP_SUMMARY"

  update-generated-files:
    name: Update generated files
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
      - name: Discover Go modules
        id: modules
        uses: ARM-software/golang-utils/actions/detect-go-modules@latest
      - name: Go mod tidy before generation
        shell: bash
        env:
          GO_MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            [[ -n "$module" ]] || continue
            echo "Tidying ${module}"
            (
              cd "$module"
              go mod tidy
            )
          done <<< "$GO_MODULES"
      - name: Run go generate in every module
        shell: bash
        env:
          GO_MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            [[ -n "$module" ]] || continue
            echo "Generating ${module}"
            (
              cd "$module"
              go generate -x ./...
            )
          done <<< "$GO_MODULES"
      - name: Go mod tidy after generation
        shell: bash
        env:
          GO_MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            [[ -n "$module" ]] || continue
            echo "Tidying ${module} after generation"
            (
              cd "$module"
              go mod tidy
            )
          done <<< "$GO_MODULES"
      - name: Sync workspace
        if: ${{ hashFiles('go.work') != '' }}
        uses: ARM-software/golang-utils/actions/sync-go-workspace@latest
      - name: Commit generated changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate generated files"
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "## :warning: CI failure" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated files could not be refreshed and committed automatically." >> "$GITHUB_STEP_SUMMARY"

  discover-go-modules:
    name: Discover Go modules
    runs-on: ubuntu-latest
    outputs:
      go-modules: ${{ steps.discover.outputs.modules-json }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
      - name: Discover Go modules
        id: discover
        uses: ARM-software/golang-utils/actions/detect-go-modules@latest

  verify-go-modules:
    name: Generate, lint, test, and cover Go modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Sync workspace
        uses: ARM-software/golang-utils/actions/sync-go-workspace@latest
      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: Set up gotestsum
        uses: ARM-software/golang-utils/actions/setup-gotestsum@latest
        with:
          version: v1.13.0
      - name: Run generate, lint, tests, and coverage
        uses: ARM-software/golang-utils/actions/go-multimodules@latest
        with:
          task: verify
          build-tags: integration

  build-all-modules:
    needs: discover-go-modules
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        go-module: ${{ fromJson(needs.discover-go-modules.outputs.go-modules) }}
    name: Build all modules
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Sync workspace
        if: ${{ hashFiles('go.work') != '' }}
        uses: ARM-software/golang-utils/actions/sync-go-workspace@latest
      - name: Build ${{ matrix.go-module }} on ${{ matrix.os }}
        run: go build -v ./...
        working-directory: ${{ matrix.go-module }}
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "## :warning: CI failure" >> "$GITHUB_STEP_SUMMARY"
          echo "Build failed for module \\`${{ matrix.go-module }}\\` on runner \\`${{ matrix.os }}\\`." >> "$GITHUB_STEP_SUMMARY"
  dogfood-action:
    name: Dogfood Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
      - name: Detect whether published releases exist
        id: published-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: |
          has_release="$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq 'length > 0')"
          echo "has-release=${has_release}" >> "$GITHUB_OUTPUT"
      - name: Run local action against published release
        if: steps.published-releases.outputs.has-release == 'true'
        id: install-published-release
        uses: ./actions/install-tool
        with:
          action-repo: ${{ github.repository }}
      - name: Verify published release cmd output
        if: steps.published-releases.outputs.has-release == 'true'
        shell: bash
        run: |
          cmd="${{ steps.install-published-release.outputs.cmd }}"
          test -n "$cmd"
      - name: Skip published release install check when no releases exist
        if: steps.published-releases.outputs.has-release != 'true'
        run: echo "No published GitHub release exists yet; skipping published release install check."
      - name: Run local action at current commit SHA
        id: install-current-sha
        uses: ./actions/install-tool
        with:
          action-repo: ${{ github.repository }}
          action-ref: ${{ github.sha }}
      - name: Verify current commit SHA cmd output
        shell: bash
        run: |
          cmd="${{ steps.install-current-sha.outputs.cmd }}"
          test -n "$cmd"
      - name: Run local action and force source build
        id: install-force-source
        env:
          FORCE_SOURCE_BUILD: "true"
        uses: ./actions/install-tool
        with:
          action-repo: ${{ github.repository }}
      - name: Verify forced source build cmd output
        shell: bash
        run: |
          cmd="${{ steps.install-force-source.outputs.cmd }}"
          test -n "$cmd"
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "## :warning: CI failure" >> "$GITHUB_STEP_SUMMARY"
          echo "Dogfooding the generated GitHub Action failed." >> "$GITHUB_STEP_SUMMARY"
