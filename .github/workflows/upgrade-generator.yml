# Code generated by our bespoke codegen `go-sdk-generator` (0.42.1).

name: Upgrade Generator

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Regenerate overwrite-managed files as well"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-generator:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'dependabot/')
    name: Upgrade generator outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GIT_SECRET || github.token }}

      - name: Run go-sdk-generator generate action
        id: generate-action
        uses: Arm-Debug/go-sdk-generator/actions/generate@v0.44.1
        with:
          input: generate.yml
          output: .
          overwrite: ${{ github.event.inputs.overwrite || 'false' }}
          go-version: 1.26.5

      - name: Detect generated changes
        id: generated-changes
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read generator version from CLI
        if: steps.generated-changes.outputs.changed == 'true'
        id: generator-cli-version
        shell: bash
        run: |
          cmd="${{ steps.generate-action.outputs.cmd }}"
          test -n "$cmd"
          generator_version="$($cmd --version)"
          test -n "$generator_version"
          {
            echo 'generator-version<<EOF'
            echo "$generator_version"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create news file for generated changes
        if: steps.generated-changes.outputs.changed == 'true'
        shell: bash
        run: |
          python -m pip install continuous-delivery-scripts
          cd-create-news-file --type bugfix ":camel: Regenerate project output after upgrading ${{ steps.generator-cli-version.outputs.generator-version }}."

      - name: Commit changes on non-default branches
        if: steps.generated-changes.outputs.changed == 'true' && (github.head_ref || github.ref_name) != github.event.repository.default_branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m ":robot: chore: upgrade generator outputs"
          git push

      - name: Create pull request from default branch
        if: steps.generated-changes.outputs.changed == 'true' && (github.head_ref || github.ref_name) == github.event.repository.default_branch
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GIT_SECRET || github.token }}
          commit-message: ":robot: chore: upgrade generator outputs"
          title: ":robot: chore: upgrade generator outputs"
          body: |
            Regenerated the project using the latest configured `go-sdk-generator` action workflow.
          branch: automation/upgrade-generator
          branch-suffix: timestamp
