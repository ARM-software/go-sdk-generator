# Code generated by our bespoke codegen `go-sdk-generator` (0.47.0).

name: sbom

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  go_version: "1.26.5"

jobs:
  cds-spdx:
    name: CDS SPDX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install CI/CD tools
        run: pip install continuous-delivery-scripts>=2.7 && pip list

      - name: Download Go module dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t module_dirs < <(find . -name go.mod -not -path '*/vendor/*' -printf '%h\n' | sort -u)
          for module_dir in "${module_dirs[@]}"; do
            echo "Downloading dependencies for ${module_dir}"
            (
              cd "${module_dir}"
              go mod download all
            )
          done

      - name: Generate CDS SPDX documents
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/cds-spdx
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          cd-generate-spdx -o "${REPORT_DIR}" -v

      - name: Add CDS summary to workflow run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## CDS SPDX"
            echo
            echo "Generated third-party IP reports and SPDX tag-value documents with CDS."
            echo
            echo "- HTML report: third_party_IP_report.html"
            echo "- Download: available from the cds-spdx workflow artifact for this run"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload CDS SPDX artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cds-spdx
          path: ${{ runner.temp }}/cds-spdx
          if-no-files-found: error

  spdx-sbom:
    name: SPDX SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate SPDX JSON SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: spdx-sbom
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SPDX SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: spdx-sbom
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Add SBOM summary to workflow run
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## SPDX SBOM"
            echo
            echo "Generated an SPDX JSON SBOM with Syft."
            echo
            echo "- Filename: sbom.spdx.json"
            echo "- Download: available from the spdx-sbom workflow artifact for this run"
          } >> "${GITHUB_STEP_SUMMARY}"
