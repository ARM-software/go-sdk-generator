name: licensing-compliance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep the default token read-only. This workflow only reads the repository and uploads artifacts.
permissions:
  contents: read

jobs:
  license-compliance:
    name: Go Licence Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from go.work
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            cli/go.sum
            generator/go.sum

      - name: Configure access to private Go modules when required
        shell: bash
        env:
          GIT_SECRET: ${{ secrets.GIT_SECRET }}
        run: |
          set -euo pipefail
          # This remains a no-op for public-only dependency graphs.
          if [[ -n "${GIT_SECRET:-}" ]]; then
            git config --global url."https://${GIT_SECRET}:x-oauth-basic@github.com/Arm-Debug".insteadOf "https://github.com/Arm-Debug"
          fi

      - name: Download Go module dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Discover each Go module in the repository so both dependency graphs are available to go-licenses.
          mapfile -t module_dirs < <(find . -name go.mod -not -path '*/vendor/*' -printf '%h\n' | sort -u)
          for module_dir in "${module_dirs[@]}"; do
            echo "Downloading dependencies for ${module_dir}"
            (
              cd "${module_dir}"
              go mod download all
            )
          done

      - name: Install go-licenses
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/google/go-licenses/v2@latest
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Collect licence report and run go-licenses check
        id: licence-check
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/licence-compliance
          FIRST_PARTY_IGNORE: github.com/Arm-Debug/go-sdk-generator
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          : > "${REPORT_DIR}/licences.md"
          : > "${REPORT_DIR}/check.log"
          : > "${REPORT_DIR}/go-licenses.stderr.log"
          check_failed=0
          template_file="${REPORT_DIR}/go-licences-report.tpl"

          # Render straight to Markdown so the uploaded report is readable in GitHub without extra conversion steps.
          cat > "${template_file}" <<'EOF'
          {{ range . }}| `{{ .Name }}` | `{{ if .Version }}{{ .Version }}{{ else }}Unknown{{ end }}` | `{{ if .LicenseName }}{{ .LicenseName }}{{ else }}Unknown{{ end }}` | {{ if .LicenseURL }}[source]({{ .LicenseURL }}){{ else }}Unknown{{ end }} |
          {{ end }}
          EOF

          {
            echo "# Go Dependency Licence Report"
            echo
            echo "| Dependency | Version | Detected licence | Licence/source URL |"
            echo "| --- | --- | --- | --- |"
          } > "${REPORT_DIR}/licences.md"

          for module_dir in cli generator; do
            echo "Scanning ${module_dir}/..." | tee -a "${REPORT_DIR}/go-licenses.stderr.log"
            (
              cd "${module_dir}"
              # Ignore first-party packages so the report stays focused on third-party dependencies.
              go-licenses report ./... --ignore "${FIRST_PARTY_IGNORE}" --template "${template_file}"
            ) >> "${REPORT_DIR}/licences.md" 2>> "${REPORT_DIR}/go-licenses.stderr.log"

            if ! (
              cd "${module_dir}"
              # Preserve the stock go-licenses check behaviour and only exclude first-party packages.
              go-licenses check ./... --ignore "${FIRST_PARTY_IGNORE}"
            ) >> "${REPORT_DIR}/check.log" 2>&1; then
              check_failed=1
            fi
          done

          # Count table rows to give the summary a quick sense of report size.
          dependency_count=$(grep -c '^| `' "${REPORT_DIR}/licences.md" || true)

          {
            echo "## Go Dependency Licence Check"
            echo
            if [[ "${check_failed}" -eq 0 ]]; then
              echo "Result: **PASS**"
            else
              echo "Result: **FAIL**"
            fi
            echo
            echo "Dependencies reported: **${dependency_count}**"
            echo
            if [[ -s "${REPORT_DIR}/check.log" ]]; then
              echo "Check output:"
              echo '```text'
              cat "${REPORT_DIR}/check.log"
              echo '```'
            else
              echo "Check output: no issues reported by go-licenses check"
            fi
          } > "${REPORT_DIR}/summary.md"

          echo "status=$([[ "${check_failed}" -eq 0 ]] && echo pass || echo fail)" >> "${GITHUB_OUTPUT}"

      - name: Add licence summary to workflow run
        if: always()
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/licence-compliance
        run: |
          set -euo pipefail
          if [[ -f "${REPORT_DIR}/summary.md" ]]; then
            cat "${REPORT_DIR}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Go Dependency Licence Check" >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo "The licence check did not finish cleanly, so no summary report was generated." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload detailed licence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-licence-report
          path: |
            ${{ runner.temp }}/licence-compliance/licences.md
            ${{ runner.temp }}/licence-compliance/check.log
            ${{ runner.temp }}/licence-compliance/go-licenses.stderr.log
          if-no-files-found: error

      - name: Fail when go-licenses check reports issues
        if: steps.licence-check.outputs.status != 'pass'
        shell: bash
        run: |
          set -euo pipefail
          echo "go-licenses check reported issues. See the step summary and the go-licence-report artifact for details." >&2
          exit 1

  spdx-sbom:
    name: SPDX SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SPDX JSON SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: spdx-sbom
          syft-version: v1.42.3
          # Upload once via upload-artifact below so the workflow controls the final artefact name explicitly.
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SPDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spdx-sbom
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Add SBOM summary to workflow run
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## SPDX SBOM"
            echo
            echo "An SPDX SBOM was generated."
            echo
            echo "- Filename: `sbom.spdx.json`"
            echo "- Download: available from the `spdx-sbom` workflow artifact for this run"
          } >> "${GITHUB_STEP_SUMMARY}"
