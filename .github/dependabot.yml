# Code generated by our bespoke codegen `go-sdk-generator` (0.47.0).

version: 2
updates:
- package-ecosystem: gomod
  directory: "/generator"
  schedule:
    interval: daily
    timezone: Europe/London
  open-pull-requests-limit: 10
  rebase-strategy: disabled
  groups:
    golang-utils:
      applies-to: version-updates
      patterns:
        - "github.com/ARM-software/golang-utils/utils/*"
    embedded-development-services-client-utils:
      applies-to: version-updates
      patterns:
        - "github.com/ARM-software/embedded-development-services-client-utils/utils"
        - "github.com/ARM-software/embedded-development-services-client-utils/utils/*"
- package-ecosystem: gomod
  directory: "/cli"
  schedule:
    interval: daily
    timezone: Europe/London
  open-pull-requests-limit: 10
  rebase-strategy: disabled
  groups:
    golang-utils:
      applies-to: version-updates
      patterns:
        - "github.com/ARM-software/golang-utils/utils/*"
    embedded-development-services-client-utils:
      applies-to: version-updates
      patterns:
        - "github.com/ARM-software/embedded-development-services-client-utils/utils"
        - "github.com/ARM-software/embedded-development-services-client-utils/utils/*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: Europe/London
  open-pull-requests-limit: 10
  rebase-strategy: disabled
  groups:
    actions-security:
      applies-to: security-updates
      patterns:
        - "*"
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
    timezone: Europe/London
  open-pull-requests-limit: 10
  rebase-strategy: disabled
