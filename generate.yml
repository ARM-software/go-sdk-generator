specification:
  package_name: go-sdk-generator
  main_module: generator
  name: SDK Generator
  description: SDK/CLI generator from a specification following [schema](https://github.com/Arm-Debug/go-sdk-generator/blob/main/generator/schema/schema.yml)
  interface:
    notCloseable: true
    methods:
      - name: Generate
        description: Generate the tool
        returns:
          - name: err
            lang_type: error
            description: Whether the generation failed or not

  command_line_commands:
    binary: go-sdk-generator
    root_environment_var: SDK_GENERATOR
    description: CLI for generating SDK/CLI go tools from a specification following [schema](https://github.com/Arm-Debug/go-sdk-generator/blob/main/generator/schema/schema.yml)
    functions:
      - name: Generate
        description: Generate tool/project scaffolding. Run `go mod tidy` afterwards to resolve the generated module dependencies, then run `go generate ./...` to execute any generated code-generation directives inside the new project.
        configuration:
          - name: Input
            lang_type: string
            mapstructure_tag: input
            description: path to tool definition file
            arg_short: "i"
            required: true
          - name: Output
            lang_type: string
            mapstructure_tag: output
            description: destination of the generated code
            required: true
            arg_short: "o"
            default_value: here
          - name: Generate
            lang_type: bool
            mapstructure_tag: overwrite
            description: regenerate all files
            default_value: "false"
            arg_short: "a"
          - name: TargetedGo
            lang_type: version
            arg_short: "g"
            description: targeted go version for the tool
            mapstructure_tag: go_version
      - name: Schema
        description: Run `go-sdk-generator schema` to dump the embedded manifest schema as JSON for agents and other tooling
        no_action: true
        configuration: []
      - name: Agent
        description: Run `go-sdk-generator agent --init` to initialise the repo skills under .agents/skills
        no_action: true
        configuration:
          - name: Init
            lang_type: bool
            mapstructure_tag: init
            description: install the embedded skills into the current repository
  global_configuration:
    - name: input
      lang_type: string
      mapstructure_tag: input
      description: path to tool definition file
      required: true
    - name: output
      lang_type: string
      mapstructure_tag: output
      description: destination of the generated code
      required: true
    - name: overwrite
      lang_type: bool
      required: true
      mapstructure_tag: overwrite
      description: regenerate all files
    - name: targetedGoVersion
      lang_type: version
      description: targeted go version for the tool
      mapstructure_tag: go_version
      default_value: "1.24.6"
      required: true

  release_to_artifactory: true
  release_to_public_artifactory:
    artifactory_host: https://arm.jfrog.io
    registry: tools-tools-local-deb
  distribute_oci:
    description: OCI image for running go-sdk-generator in CI and reproducible containerised workflows.
    labels:
      io.arm.feature: contract-first-sdk-generation
    attributes:
      org.opencontainers.image.documentation: https://github.com/Arm-Debug/go-sdk-generator/blob/main/DOCUMENTATION.md
